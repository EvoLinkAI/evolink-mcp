name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Inspect publish contents
        run: |
          npm pack --dry-run --workspace packages/evolink-media
          npm pack --dry-run --workspace packages/evolink-media-beta
          npm pack --dry-run --workspace packages/evolink-router

      - name: Publish @evolinkai/mcp
        working-directory: packages/evolink-media
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @evolinkai/mcp-beta
        working-directory: packages/evolink-media-beta
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @evolinkai/mcp-router
        working-directory: packages/evolink-router
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
